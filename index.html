<!DOCTYPE html>
<html lang="en" data-theme="auto"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Shared Space · Andrew</title>
<link rel="stylesheet" href="/assets/pico.min.css">
<style>
/* Project title tile on the hub */
a.tile { display: block; }
a.tile { background: var(--pico-card-background-color);
  padding: var(--pico-block-spacing-vertical) var(--pico-block-spacing-horizontal);
  border-radius: var(--pico-border-radius);
  transition: transform .08s ease, box-shadow .12s ease; }
a.tile:active { transform: scale(.99); }
a.tile .title { font-size: 1.05rem; font-weight: 600; }
a.tile .title .arrow { margin-left: auto; opacity: .5; }
a.tile .about { display: block; margin-top: .35rem;
  color: var(--pico-muted-color); font-size: .88rem; }
a.tile .row { display: block; margin-top: .5rem; }

/* Status pill */
.pill { display: inline-block; font-size: .72rem; font-weight: 600;
  padding: 2px 9px; border-radius: 999px; color: #fff; vertical-align: middle; }
.pill.active  { background: #2f9e69; }
.pill.ongoing { background: #2f9e69; }
.pill.parked  { background: #c9a227; }
.pill.done    { background: #6c7686; }

/* Tags use a muted, non-accent pill */
.tag { display: inline-block; font-size: .7rem; font-weight: 600;
  padding: 1px 8px; border-radius: 999px; vertical-align: middle;
  background: var(--pico-secondary-background);
  color: var(--pico-secondary-inverse); }
</style>
</head><body>
<main class="container">
<h1 style="margin-bottom:.25rem">Shared Space</h1>
<p style="color:var(--pico-muted-color);margin-bottom:1.5rem">Updated Oct 22 2026, 03:22 PM · 1 project(s) · tap one to open it</p>

  <a class="tile" href="/shared-space/">
    <span class="title">Shared Space
      <span class="pill active" style="margin-left:.4rem">active</span>
      <span class="arrow">›</span>
    </span>
    <span class="about">The browsable project hub Andrew uses so conversations and assets don&#x27;t get</span>
    <span class="row"><span class='tag'>[shared-space</span> <span class='tag'>browse</span> <span class='tag'>hub</span> <span class='tag'>projects]</span> <span class="pill" style="background:var(--pico-muted-border-color);color:var(--pico-muted-color);margin-left:.4rem">updated 2026-10-22</span></span>
  </a>
<div class="footer" style="margin-top:2.5rem;text-align:center;color:var(--pico-muted-color);font-size:.8rem">
  Shared space · generated Oct 22 2026, 03:22 PM · <a href="https://github.com/andrewsouthard/shared-space">repo</a>
</div>
</main>
</body></html>
